name: Build and validate mobile plugin
on:
  push:
    branches: [feature/mobile-sync]
  pull_request:
    branches: [main, fix/sync-reliability]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Compile and bundle plugin
        run: npm run build
      - name: Exercise mobile filesystem and real Git operations
        run: node tests/mobile-adapter.cjs
      - name: Publish beta plugin files
        uses: actions/upload-artifact@v4
        with:
          name: github-sync-mobile-beta
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 14
      - name: Ensure browser/mobile bundle has no eager Node imports
        run: |
          test -f main.js
          node -e "const fs=require('fs'); const s=fs.readFileSync('main.js','utf8'); if(!s.includes('MobileSync')) process.exit(1)"
      - name: Persist refreshed dependency lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/mobile-sync'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: refresh dependency lock for mobile support"
            git push origin HEAD:feature/mobile-sync
          fi
